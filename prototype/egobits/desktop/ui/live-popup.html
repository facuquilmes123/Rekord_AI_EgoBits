<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekord AI · Próximas pistas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="live-popup">
  <header>
    <div style="display:flex;align-items:center;gap:10px">
      <img src="rekord-ia.png" alt="Rekord AI" width="28" height="28" style="filter:drop-shadow(0 0 8px rgba(0,210,255,0.45));flex-shrink:0">
      <div>
        <strong>Rekord AI · Próximas pistas</strong>
        <p id="source" class="hint" role="status" style="font-size:0.68rem;color:var(--accent-cyan);margin:0">Conectando con tu colección…</p>
      </div>
    </div>
    <button id="dismiss" type="button" aria-label="Ocultar recomendaciones">×</button>
  </header>
  <main id="suggestions"></main>
  <p id="drag-help" class="hint" aria-live="polite" style="margin-top:10px;text-align:center;font-size:0.72rem;color:var(--text-muted)">
    ✦ Mantené presionada una pista y arrastrala directo al Deck de Rekordbox.
  </p>
  <script src="live-popup.js"></script>
</body>
</html>
